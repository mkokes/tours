title: Nepal
description: >-
  Temples and back streets in the Kathmandu Valley, a night in the hills at Ghandruk under the
  Annapurnas, a walk along Phewa Lake in Pokhara, and a jungle safari in Chitwan.
location: Nepal
cover: IMG_20251021_175814_00_086.jpg

# The camera clock was on US Central time until it synced on Oct 21, so photos before then
# carry a corrected `taken` time (Nepal time = camera time + 10:45). The camera recorded no GPS;
# positions are best guesses from the places visited.
